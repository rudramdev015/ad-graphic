# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Render asks for the values marked `sync: false` when you create it.
services:
  - type: web
    name: adgraphic-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
